name = "e88-finsys"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Static SPA (served for any non-/api path)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 database. database_id is filled in after `wrangler d1 create e88`.
[[d1_databases]]
binding = "DB"
database_name = "e88"
database_id = "ed5e7a18-4f30-4ec2-9b2f-4b94d05f3a6e"
