              raise SystemExit("The embedded repair package is incomplete.")

          for relative_name, encoded_content in files.items():
              path = Path(relative_name)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe embedded path: {relative_name}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded_content))

          print(f"Restored {len(files)} complete E88 login repair files.")
          PY

      - name: Install and verify the complete repair
        run: |
          npm install
          npm run check
          npm run test:unit
          npm run test:integration

      - name: Save the complete repair to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --
            public/app.css
            public/app.js
            public/logo.png
            public/index.html
            test/auth.integration.mjs
            test/auth.test.mjs
            package.json
            package-lock.json
            migrations/0014_application_auth.sql
            src/routes/auth.js
            src/routes/admin.js
            src/index.js
            src/lib/crypto.js
            src/lib/auth.js
            scripts/check-structure.mjs
            scripts/apply-database.mjs
            LOGIN_REPAIR_V8_1_1.md
            ARCHITECTURE.md
            DEPLOYMENT.md
          if git diff --cached --quiet; then
            echo "All complete repair files are already saved."
          else
            git commit -m "Complete E88 FinSys login repair"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install application login and activation tables
        run: npx wrangler d1 execute DB --remote --file=migrations/0014_application_auth.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy E88 FinSys login repair
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
