      - name: Verify login, module access, shared records, and launchpad
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run test:integration

      - name: Save connected foundation to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/app.js public/app.css public/index.html src/index.js src/lib/auth.js src/lib/workspace.js src/routes/admin.js src/routes/session.js src/routes/workspace.js src/routes/stations.js src/routes/masters.js migrations/0015_user_access_station_connections.sql migrations/0016_clean_module_workspace.sql scripts/apply-database.mjs scripts/check-structure.mjs test/auth.integration.mjs
          if git diff --cached --quiet; then
            echo "The connected foundation is already saved."
          else
            git commit -m "Build E88 connected enterprise foundation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install per-user module access
        run: npx wrangler d1 execute DB --remote --file=migrations/0015_user_access_station_connections.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install clean shared module workspace
        run: npx wrangler d1 execute DB --remote --file=migrations/0016_clean_module_workspace.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy E88 connected enterprise foundation
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
