      - name: Verify all modules, data controls, login, and access
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check openpyxl
          npm run check
          npm run test:unit
          npm run test:data
          npm run test:integration

      - name: Save complete connected ERP to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public src package.json package-lock.json wrangler.toml README.md CHANGELOG.md
          git add -- migrations/0012_ramco_enterprise.sql migrations/0013_atlas_receiving_workbench.sql migrations/0014_application_auth.sql migrations/0015_user_access_station_connections.sql migrations/0016_clean_module_workspace.sql migrations/0017_inbound_logistics_control.sql migrations/0018_sales_distribution_custody.sql migrations/0019_connected_finance_engine.sql
          git add -- scripts/apply-database.mjs scripts/check-structure.mjs scripts/predeploy-guard.mjs scripts/self_test.py scripts/smoke-test.mjs test/auth.integration.mjs test/auth.test.mjs test/codes.test.mjs test/receiving.test.mjs test/module-definitions.test.mjs
          if git diff --cached --quiet; then
            echo "The connected foundation is already saved."
          else
            git commit -m "Complete E88 connected ERP operations and approvals"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install connected ERP database controls
        run: |
          npx wrangler d1 execute DB --remote --file=migrations/0015_user_access_station_connections.sql
          npx wrangler d1 execute DB --remote --file=migrations/0016_clean_module_workspace.sql
          npx wrangler d1 execute DB --remote --file=migrations/0017_inbound_logistics_control.sql
          npx wrangler d1 execute DB --remote --file=migrations/0018_sales_distribution_custody.sql
          npx wrangler d1 execute DB --remote --file=migrations/0019_connected_finance_engine.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure contract document storage
        run: npx wrangler r2 bucket create e88-finsys-documents || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy complete E88 connected ERP
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live connected ERP release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          base = 'https://e88-finsys.nrd-e88.workers.dev'
          headers = {
              'User-Agent': 'Mozilla/5.0 (GitHub Actions; E88 deployment verifier)',
              'Accept': 'text/html,application/json,*/*',
              'Cache-Control': 'no-cache',
          }

          def fetch(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode('utf-8'), response.headers

          error = None
          for attempt in range(10):
              try:
                  index, index_headers = fetch('/')
                  script, _ = fetch('/foundation.js?v=1100-full5')
                  styles, _ = fetch('/foundation.css?v=1100-full5')
                  health_text, _ = fetch('/api/health')
                  health = json.loads(health_text)
                  assert 'E88-FULL-ERP-20260731-R5' in index
                  assert '/foundation.js?v=1100-full5' in index
                  assert '/app.js' not in index
                  assert 'Inventory & Serials' not in index
                  assert 'E88-FULL-ERP-20260731-R5' in script
                  assert 'renderSalesOrderWorkspace' in script
                  assert 'renderSourcingWorkspace' in script
                  assert 'renderModuleReports' in script
                  assert 'renderModuleSetup' in script
                  assert 'renderAccessAudit' in script
                  assert 'renderEmptyWorkspace' not in script
                  assert 'workbenchShell' in script
                  assert 'renderOutboundWorkspace' in script
                  assert 'renderFinanceWorkspace' in script
                  assert 'Prepare Reconciliation' in script
                  assert 'Synchronize Operational Transactions' in script
                  assert 'adminWorkbenchShell' in script
                  assert 'Allowed Modules' in script
                  assert 'Action Authority' in script
                  assert 'Request Reversal' in script
                  assert '.erp-workbench' in styles
                  assert '.access-selector' in styles
                  assert '.access-workbench' in styles
                  assert '.access-authority' in styles
                  assert '.finance-lines' in styles
                  assert index_headers.get('X-E88-Build') == 'E88-FULL-ERP-20260731-R5'
                  assert health.get('build') == 'E88-FULL-ERP-20260731-R5'
                  print('Live verification passed: complete connected ERP is deployed.')
                  break
              except Exception as exc:
                  error = exc
                  if attempt == 9:
                      raise
                  time.sleep(3)
          PY
