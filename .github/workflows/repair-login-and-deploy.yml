name: Repair E88 FinSys Login and Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type E88_REPAIR_LOGIN to install the application login and deploy'
        required: true
        type: string

jobs:
  repair-login-and-deploy:
    if: ${{ inputs.confirmation == 'E88_REPAIR_LOGIN' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Install application login and activation tables
        run: npx wrangler d1 execute DB --remote --file=migrations/0014_application_auth.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy E88 FinSys login repair
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
