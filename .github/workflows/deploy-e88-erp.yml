name: Deploy E88 ERP Direct - D1 Only (No Tests, No R2)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type E88_ROLLOUT_DEPLOY to continue
        required: true
        type: string
      database_mode:
        description: Choose how the configured D1 database will be prepared
        required: true
        default: upgrade_existing
        type: choice
        options:
          - upgrade_existing
          - bootstrap_empty_database
      run_smoke_test:
        description: Verify the live Worker and D1 binding after deployment
        required: true
        default: true
        type: boolean
      deployment_url:
        description: Live Worker URL used for the smoke test
        required: true
        default: https://e88-finsys.nrd-e88.workers.dev
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  E88_BUILD: E88-ROLLOUT-ERP-20260731-R13.1

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'E88_ROLLOUT_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40

    steps:
      - name: Check out rollout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment inputs and D1-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "E88_ROLLOUT_DEPLOY"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -f package.json || { echo "Missing package.json"; exit 1; }
          test -f wrangler.toml || { echo "Missing wrangler.toml"; exit 1; }
          grep -q 'binding = "DB"' wrangler.toml
          if grep -q 'binding = "DOCS"' wrangler.toml; then
            echo "DOCS R2 binding is still present. Remove it for the no-R2 rollout."
            exit 1
          fi

      - name: Install deployment dependencies only
        run: npm ci

      - name: Confirm Cloudflare authentication
        run: npx wrangler whoami

      - name: Verify existing D1 prerequisite
        if: ${{ inputs.database_mode == 'upgrade_existing' }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --command="SELECT acquisition_cost,valuation_status FROM erp_assets LIMIT 1;"
          echo "Existing connected schema detected. Applying rollout-safe extensions."

      - name: Upgrade existing D1 without replacing records
        if: ${{ inputs.database_mode == 'upgrade_existing' }}
        run: |
          npx wrangler d1 execute DB --remote --file=migrations/0021_rollout_specialist_engines.sql
          npx wrangler d1 execute DB --remote --file=migrations/0022_inventory_class_r2_rollout.sql

      - name: Confirm D1 is empty before bootstrap
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        run: node scripts/verify-empty-d1.mjs

      - name: Bootstrap empty D1 with approved opening records
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        env:
          E88_BOOTSTRAP_CONFIRM: E88_NEW_DATABASE
        run: node scripts/apply-database.mjs --remote --confirm=E88_NEW_DATABASE

      - name: Show D1 record counts before deployment
        shell: bash
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT 'items' record_type,COUNT(*) records FROM erp_items UNION ALL SELECT 'serialized_assets',COUNT(*) FROM erp_assets UNION ALL SELECT 'stock_movements',COUNT(*) FROM erp_stock_ledger UNION ALL SELECT 'enterprise_records',COUNT(*) FROM erp_enterprise_records;"

      - name: Deploy Worker with D1 binding
        uses: cloudflare/wrangler-action@v3
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live Worker and D1
        if: ${{ inputs.run_smoke_test }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          BASE="${DEPLOYMENT_URL%/}"
          for attempt in $(seq 1 12); do
            HEALTH=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$BASE/api/health" || true)
            echo "Attempt $attempt: $HEALTH"
            if echo "$HEALTH" | grep -q '"d1Bound":true' \
              && echo "$HEALTH" | grep -q '"d1Ready":true' \
              && echo "$HEALTH" | grep -q '"r2Bound":false'; then
              echo "Live deployment verification passed."
              exit 0
            fi
            sleep 5
          done
          echo "Live verification failed. Review Worker logs and the D1 binding."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E88 ERP direct deployment"
            echo "- Build: $E88_BUILD"
            echo "- Code tests: Skipped by user request"
            echo "- Database mode: ${{ inputs.database_mode }}"
            echo "- D1 binding: DB"
            echo "- R2: Disabled"
            echo "- Deployment URL: ${{ inputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
