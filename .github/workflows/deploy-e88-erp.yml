name: Deploy E88 ERP - D1 Only (landed cost + per-class reconciliation)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type E88_ROLLOUT_DEPLOY to continue
        required: true
        type: string
      database_mode:
        description: How to prepare the D1 database
        required: true
        default: upgrade_existing
        type: choice
        options:
          - upgrade_existing            # SAFE: keep all data, apply code + new migrations
          - clean_rebuild_from_atlas    # DESTRUCTIVE: back up, wipe, reload opening stock from ATLAS
          - bootstrap_empty_database
      rebuild_confirmation:
        description: For clean_rebuild ONLY, type E88_WIPE_AND_REBUILD (otherwise leave blank)
        required: false
        default: ''
        type: string
      run_smoke_test:
        description: Verify the live Worker and D1 binding after deployment
        required: true
        default: true
        type: boolean
      deployment_url:
        description: Live Worker URL used for the smoke test
        required: true
        default: https://e88-finsys.nrd-e88.workers.dev
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  E88_BUILD: E88-ROLLOUT-ERP-20260731-R13.1

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'E88_ROLLOUT_DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "E88_ROLLOUT_DEPLOY"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -f package.json && test -f wrangler.toml
          grep -q 'binding = "DB"' wrangler.toml
          if [ "${{ inputs.database_mode }}" = "clean_rebuild_from_atlas" ] && [ "${{ inputs.rebuild_confirmation }}" != "E88_WIPE_AND_REBUILD" ]; then
            echo "clean_rebuild_from_atlas selected but rebuild_confirmation is not E88_WIPE_AND_REBUILD. Aborting to protect data."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Confirm Cloudflare authentication
        run: npx wrangler whoami

      # ---------- ALWAYS back up before touching data ----------
      - name: Back up D1 (saved as a downloadable artifact)
        shell: bash
        run: npx wrangler d1 export DB --remote --output d1-backup.sql || echo "export skipped"

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup.sql
          retention-days: 90
          if-no-files-found: warn

      # ---------- SAFE upgrade path (keeps all data) ----------
      - name: Apply rollout + landed-cost + by-class reconciliation migrations
        if: ${{ inputs.database_mode == 'upgrade_existing' || inputs.database_mode == 'clean_rebuild_from_atlas' }}
        run: |
          npx wrangler d1 execute DB --remote --file=migrations/0024_landed_cost_at_receipt.sql
          npx wrangler d1 execute DB --remote --file=migrations/0026_by_class_reconciliation_views.sql
          npx wrangler d1 execute DB --remote --file=migrations/0028_operational_setup.sql

      # ---------- Empty-database bootstrap (unchanged) ----------
      - name: Confirm D1 is empty before bootstrap
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        run: node scripts/verify-empty-d1.mjs

      - name: Bootstrap empty D1 with opening records
        if: ${{ inputs.database_mode == 'bootstrap_empty_database' }}
        env:
          E88_BOOTSTRAP_CONFIRM: E88_NEW_DATABASE
        run: node scripts/apply-database.mjs --remote --confirm=E88_NEW_DATABASE

      # ---------- DESTRUCTIVE clean rebuild (gated) ----------
      - name: Clean rebuild — wipe data (keep config) and load opening inventory from ATLAS
        if: ${{ inputs.database_mode == 'clean_rebuild_from_atlas' && inputs.rebuild_confirmation == 'E88_WIPE_AND_REBUILD' }}
        run: |
          echo "Backup already uploaded as artifact d1-backup-${{ github.run_id }}."
          npx wrangler d1 execute DB --remote --file=rebuild/wipe_data_keep_config.sql
          npx wrangler d1 execute DB --remote --file=rebuild/0027_opening_inventory_from_atlas.sql

      # ---------- Deploy the Worker ----------
      - name: Deploy Worker with D1 binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # ---------- Verify ----------
      - name: Verify inventory reconciles per class
        shell: bash
        run: |
          set -euo pipefail
          echo "Per-class reconciliation (diff should be 0):"
          npx wrangler d1 execute DB --remote --command="SELECT class_code,ROUND(subledger_value,2) sub,ROUND(gl_value,2) gl,ROUND(difference,2) diff FROM vw_erp_inventory_class_reconciliation WHERE subledger_value<>0 OR gl_value<>0;"

      - name: Verify live Worker and D1
        if: ${{ inputs.run_smoke_test }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          BASE="${DEPLOYMENT_URL%/}"
          for attempt in $(seq 1 12); do
            HEALTH=$(curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$BASE/api/health" || true)
            echo "Attempt $attempt: $HEALTH"
            if echo "$HEALTH" | grep -q '"d1Bound":true' && echo "$HEALTH" | grep -q '"d1Ready":true'; then
              echo "Live deployment verification passed."; exit 0
            fi
            sleep 5
          done
          echo "Live verification failed. Review Worker logs and the D1 binding."; exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## E88 ERP deployment"
            echo "- Build: $E88_BUILD"
            echo "- Database mode: ${{ inputs.database_mode }}"
            echo "- Backup artifact: d1-backup-${{ github.run_id }} (90-day retention)"
            echo "- Deployment URL: ${{ inputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
