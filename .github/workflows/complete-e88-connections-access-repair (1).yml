name: Install E88 Enterprise Launchpad and Complete Repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type E88_ENTERPRISE_LAUNCHPAD to install the launchpad and complete repair'
        required: true
        type: string

