      - name: Verify login, module access, shared records, and launchpad
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run test:integration

      - name: Save connected foundation to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public
          git add -- src/index.js src/lib/auth.js src/lib/workspace.js src/routes/admin.js src/routes/session.js src/routes/workspace.js src/routes/stations.js src/routes/masters.js migrations/0015_user_access_station_connections.sql migrations/0016_clean_module_workspace.sql scripts/apply-database.mjs scripts/check-structure.mjs test/auth.integration.mjs
          if git diff --cached --quiet; then
            echo "The connected foundation is already saved."
          else
            git commit -m "Build E88 connected enterprise foundation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install per-user module access
        run: npx wrangler d1 execute DB --remote --file=migrations/0015_user_access_station_connections.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install clean shared module workspace
        run: npx wrangler d1 execute DB --remote --file=migrations/0016_clean_module_workspace.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy E88 connected enterprise foundation
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live site is the clean foundation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          base = 'https://e88-finsys.nrd-e88.workers.dev'
          headers = {
              'User-Agent': 'Mozilla/5.0 (GitHub Actions; E88 deployment verifier)',
              'Accept': 'text/html,application/json,*/*',
              'Cache-Control': 'no-cache',
          }

          def fetch(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode('utf-8'), response.headers

          error = None
          for attempt in range(10):
              try:
                  index, index_headers = fetch('/')
                  script, _ = fetch('/foundation.js?v=900-foundation4')
                  styles, _ = fetch('/foundation.css?v=900-foundation4')
                  health_text, _ = fetch('/api/health')
                  health = json.loads(health_text)
                  assert 'E88-CLEAN-FOUNDATION-20260730' in index
                  assert '/foundation.js?v=900-foundation4' in index
                  assert '/app.js' not in index
                  assert 'Inventory & Serials' not in index
                  assert 'E88-CLEAN-FOUNDATION-20260730' in script
                  assert 'workbenchShell' in script
                  assert 'ramco-layout' in script
                  assert '.erp-workbench' in styles
                  assert '.access-selector' in styles
                  assert index_headers.get('X-E88-Build') == 'E88-CLEAN-FOUNDATION-20260730'
                  assert health.get('build') == 'E88-CLEAN-FOUNDATION-20260730'
                  print('Live verification passed: clean enterprise foundation is deployed.')
                  break
              except Exception as exc:
                  error = exc
                  if attempt == 9:
                      raise
                  time.sleep(3)
          PY
