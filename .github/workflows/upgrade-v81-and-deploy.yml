name: Upgrade E88 FinSys v8.1 and Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type E88_UPGRADE_V81 to apply the non-destructive v8.1 migrations and deploy'
        required: true
        type: string

jobs:
  upgrade-and-deploy:
    if: ${{ inputs.confirmation == 'E88_UPGRADE_V81' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: python -m pip install openpyxl
      - run: npm run build
      - name: Refresh canonical inventory and Ramco workbench controls
        run: npx wrangler d1 execute DB --remote --file=migrations/0012_ramco_enterprise.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install ATLAS expected shipment and receiving controls
        run: npx wrangler d1 execute DB --remote --file=migrations/0013_atlas_receiving_workbench.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy E88 FinSys Worker
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
