name: Bootstrap New D1 and Deploy E88 FinSys

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type E88_NEW_DATABASE after changing wrangler.toml to the NEW D1 database ID'
        required: true
        type: string

jobs:
  bootstrap-and-deploy:
    if: ${{ inputs.confirmation == 'E88_NEW_DATABASE' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: python -m pip install openpyxl
      - run: npm run build
      - name: Bootstrap the new/empty D1 database
        run: node scripts/apply-database.mjs --remote --confirm=E88_NEW_DATABASE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
