name: E88 FinSys checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install migration test dependency
        run: python -m pip install openpyxl
      - name: Structure, unit and data tests
        run: npm run build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e88-finsys-test-reports
          path: reports/
