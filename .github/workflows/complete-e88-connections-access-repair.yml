      - name: Verify dashboard, station connections, and user access
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run test:integration

      - name: Save complete repair to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/app.js public/app.css public/index.html src/lib/auth.js src/routes/admin.js src/routes/session.js src/routes/stations.js src/routes/masters.js migrations/0015_user_access_station_connections.sql scripts/apply-database.mjs scripts/check-structure.mjs test/auth.integration.mjs
          if git diff --cached --quiet; then
            echo "The complete repair is already saved."
          else
            git commit -m "Repair E88 connections search and user access"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install per-user access table
        run: npx wrangler d1 execute DB --remote --file=migrations/0015_user_access_station_connections.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy complete E88 repair
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
