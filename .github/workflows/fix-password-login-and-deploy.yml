name: Fix E88 Password Login and Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type E88_FIX_PASSWORD to correct password hashing and deploy'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix-password-login:
    if: ${{ inputs.confirmation == 'E88_FIX_PASSWORD' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct Cloudflare PBKDF2 limit
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const path = 'src/lib/crypto.js';
            const original = readFileSync(path, 'utf8');
            const corrected = original.replace(
              /const PASSWORD_ITERATIONS = [0-9]+;/,
              'const PASSWORD_ITERATIONS = 100000;',
            );
            if (!corrected.includes('const PASSWORD_ITERATIONS = 100000;')) {
              throw new Error('Unable to apply PBKDF2 correction.');
            }
            writeFileSync(path, corrected);
          "
          node --check src/lib/crypto.js
          grep -F "const PASSWORD_ITERATIONS = 100000;" src/lib/crypto.js

      - name: Verify password login
        run: |
          npm install
          npm run check
          npm run test:unit
          npm run test:integration

      - name: Save password correction to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/crypto.js
          if git diff --cached --quiet; then
            echo "PBKDF2 correction is already saved."
          else
            git commit -m "Fix E88 password hashing for Cloudflare"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Deploy corrected password login
        run: npx wrangler deploy
        env:
          E88_DEPLOY_CONFIRM: CONNECTED_SCHEMA_INSTALLED
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
