<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E88 FinSys</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--navy:#0b1f3a;--navy2:#12294a;--ink:#1f2733;--mut:#64748b;--line:#e6e9ee;--bg:#f4f6f9;--acc:#1a56db;--acc2:#eef2ff;--good:#15803d;--goodb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--blue:#1d4ed8;--blueb:#dbeafe;--grey:#475569;--greyb:#eef1f5;}
  *{box-sizing:border-box;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  html,body{margin:0;color:var(--ink);background:var(--bg);}
  header{height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;}
  header .brand{font-weight:700;letter-spacing:.5px;font-size:14px;}
  header .crumb{color:#9fb3d1;font-size:12.5px;}
  header .sp{margin-left:auto;}
  header .who{color:#cdd9ec;font-size:13px;}
  header .out{color:#9fb3d1;font-size:13px;text-decoration:none;margin-left:14px;cursor:pointer;}
  header img{height:38px;background:transparent;object-fit:contain;}
  .kpi.clk{cursor:pointer;transition:box-shadow .12s,border-color .12s;} .kpi.clk:hover{border-color:var(--acc);box-shadow:0 3px 14px rgba(26,86,219,.18);}
  tr.clk{cursor:pointer;}
  .wrap{display:flex;min-height:calc(100vh - 46px);}
  nav{width:224px;background:#fff;border-right:1px solid var(--line);padding:8px 0;overflow:auto;height:calc(100vh - 46px);position:sticky;top:46px;}
  nav .grp{padding:12px 18px 5px;font-size:11px;font-weight:700;letter-spacing:.8px;color:#94a3b8;text-transform:uppercase;}
  nav a{display:flex;align-items:center;gap:7px;padding:6px 16px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:12.5px;}
  nav a:hover{background:var(--bg);}
  nav a.active{background:var(--acc2);color:var(--acc);font-weight:600;box-shadow:inset 3px 0 0 var(--acc);}
  main{flex:1;padding:16px 20px;overflow:auto;}
  h1{font-size:17px;margin:0 0 3px;font-weight:600;}
  .sub{color:var(--mut);font-size:12px;margin:0 0 14px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .kpi .v{font-size:20px;font-weight:700;letter-spacing:-.3px;}
  .kpi .l{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
  th{background:#f8fafc;color:#475569;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;}
  tr:last-child td{border-bottom:none;} tbody tr:hover{background:#fbfcfe;}
  .chip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--greyb);color:var(--grey);}
  .chip.good{background:var(--goodb);color:var(--good);} .chip.warn{background:var(--warnb);color:var(--warn);}
  .chip.bad{background:var(--badb);color:var(--bad);} .chip.blue{background:var(--blueb);color:var(--blue);}
  .toolbar{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  input,select,button,textarea{font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2);}
  button{cursor:pointer;} button.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;}
  button.sm{padding:5px 10px;font-size:13px;} button.ghost{background:#fff;}
  .muted{color:var(--mut);} .right{margin-left:auto;} .rt{text-align:right;}
  .modal-bg{position:fixed;inset:0;background:rgba(11,31,58,.5);display:none;align-items:flex-start;justify-content:center;padding-top:5vh;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:22px;width:min(680px,94vw);box-shadow:0 24px 70px rgba(0,0,0,.3);max-height:88vh;overflow:auto;}
  .modal h2{margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;} .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .err{color:var(--bad);} .ok{color:var(--good);}
  .jl-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center;}
  .login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 10px 40px rgba(16,24,40,.08);}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;margin-bottom:18px;align-items:start;}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .gcard .gh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px;color:var(--navy);margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line);}
  .gcard .gh .ic{width:30px;height:30px;border-radius:8px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .gtile{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:12.5px;transition:all .12s;}
  .gtile:last-child{margin-bottom:0;}
  .gtile:hover{border-color:var(--acc);background:var(--acc2);color:var(--acc);transform:translateX(2px);}
  .gtile .ar{color:#cbd5e1;font-size:16px;} .gtile:hover .ar{color:var(--acc);}
  .addons{display:flex;flex-wrap:wrap;gap:9px;}
  .addon{padding:9px 15px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--navy);transition:all .12s;}
  .addon:hover{border-color:var(--acc);background:var(--acc2);color:var(--acc);}
  .perms{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .pbox{padding:6px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px;user-select:none;background:#fff;transition:all .12s;}
  .pbox:hover{border-color:var(--acc);}
  .pbox.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;}
  .permchips{display:flex;flex-wrap:wrap;gap:5px;}
  .permchips .pc{background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="E88 Ventures" />
  <span class="brand">FinSys</span>
  <span class="crumb" id="crumb">Dashboard</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <a class="out" href="/logout">Sign out</a>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const A=(p,o)=>fetch('/api'+p,o).then(r=>r.json());
const POST=(p,b)=>A(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const PUT=(p,b)=>A(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const val=id=>{const e=document.getElementById(id);return e?e.value:'';};
function chipCls(s){s=String(s||'').toUpperCase();if(['POSTED','ACTIVE','RECEIVED','AVAILABLE','CLEARED','PAID'].includes(s))return'good';if(['DRAFT','FOR_DELIVERY','OPEN','PENDING','MAINTENANCE'].includes(s))return'warn';if(['VOID','INACTIVE','CANCELLED'].includes(s))return'bad';if(['SOLD','LEASED','RELEASED','TRANSFERRED','MAPPED','ISSUED'].includes(s))return'blue';return'';}
let REG={}, GROUPS={}, LOOK={}, CUR='home', PENDING=null;
const GRP_ORDER=['Fixed Assets','Project Management','Inventory & Procurement','Asset Management','HCM','Finance & Accounting','Plan & Optimize','Settings'];
const GRP_ICON={'Fixed Assets':'🏗','Project Management':'📋','Inventory & Procurement':'📦','Asset Management':'⚙','HCM':'👥','Finance & Accounting':'₱','Plan & Optimize':'📈','Settings':'⚙'};
function goKpi(t){ if(t.indexOf(':')>0){const p=t.split(':');PENDING={status:p[1]};go(p[0]);} else {PENDING=null;go(t);} }
const REPORTS=[['gl','General Ledger'],['trial-balance','Trial Balance'],['ap-aging','Payables Aging'],['location-balances','Location Balances'],['fin-model','Financial Model']];

function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').style.display='flex';}
function closeModal(){document.getElementById('modalBg').style.display='none';}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};

function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  const add=(label,key)=>{const a=document.createElement('a');a.textContent=label;a.dataset.k=key;if(key===CUR)a.className='active';a.onclick=()=>go(key);nav.appendChild(a);};
  const grpHdr=t=>{const d=document.createElement('div');d.className='grp';d.textContent=t;nav.appendChild(d);};
  add('⌂ Home','home');
  add('Dashboard','dashboard');
  GRP_ORDER.forEach(g=>{if(!GROUPS[g])return;grpHdr(g);GROUPS[g].forEach(k=>add(REG[k].label,k));});
  grpHdr('Reports');REPORTS.forEach(([k,l])=>add(l,'report:'+k));
}
function go(key){CUR=key;renderNav();document.getElementById('crumb').textContent=crumbFor(key);route();}
function crumbFor(k){if(k==='home')return'Home';if(k==='dashboard')return'Dashboard';if(k.startsWith('report:')){const r=REPORTS.find(x=>x[0]===k.slice(7));return'Reports · '+(r?r[1]:'');}return (REG[k]?REG[k].group+' · '+REG[k].label:'');}

async function lookup(key){if(LOOK[key])return LOOK[key];const r=await A('/lookup/'+key);LOOK[key]=r.rows||[];return LOOK[key];}

async function route(){
  const m=document.getElementById('main');m.innerHTML='<p class="muted">Loading…</p>';
  try{
    if(CUR==='home')return viewHome(m);
    if(CUR==='dashboard')return viewDashboard(m);
    if(CUR.startsWith('report:'))return viewReport(m,CUR.slice(7));
    const mod=REG[CUR];
    if(mod&&mod.custom==='receiving')return viewReceiving(m);
    if(mod&&mod.custom==='journal')return viewJournal(m);
    return viewModule(m,CUR);
  }catch(e){m.innerHTML='<p class="err">Error: '+esc(e.message||e)+'</p>';}
}

function viewHome(m){
  let cards='';
  GRP_ORDER.forEach(g=>{
    const ks=GROUPS[g]; if(!ks||!ks.length)return;
    cards+=`<div class="gcard"><div class="gh"><span class="ic">${GRP_ICON[g]||'▦'}</span>${esc(g)}</div>`+
      ks.map(k=>`<div class="gtile" data-k="${k}"><span>${esc(REG[k].label)}</span><span class="ar">›</span></div>`).join('')+`</div>`;
  });
  const addons=[['dashboard','Dashboard'],...REPORTS.map(([k,l])=>['report:'+k,l])];
  m.innerHTML=`<h1>E88 Ventures ERP</h1>
    <div class="hgrid">${cards}</div>
    <div class="gcard"><div class="gh"><span class="ic">✦</span>Enterprise Add-ons</div>
      <div class="addons">${addons.map(([k,l])=>`<div class="addon" data-k="${k}">${esc(l)}</div>`).join('')}</div></div>`;
  m.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>go(el.dataset.k));
}
async function viewDashboard(m){
  const r=await A('/dashboard');const k=r.kpis||{};
  const cards=[['Total Serials',k.totalSerials,'serials'],['Available',k.available,'serials:AVAILABLE'],['Sold',k.sold,'sales'],['Leased',k.leased,'leases'],['Deployed',k.deployed,'serials:DEPLOYED'],['Transferred',k.transferred,'serials:TRANSFERRED'],['Open POs',k.openPOs,'pos'],['Active Stations',k.stations,'stations']];
  const m3=[['Posted Revenue',k.revenue,'sales'],['Receivables (AR)',k.arBalance,'collections'],['Payables (AP)',k.apBalance,'bills']];
  m.innerHTML=`<h1>Dashboard</h1>
    <div class="kpis">${cards.map(([l,v,g])=>`<div class="kpi clk" data-go="${g}"><div class="v">${(v||0).toLocaleString()}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="kpis">${m3.map(([l,v,g])=>`<div class="kpi clk" data-go="${g}"><div class="v">${money(v)}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="panel"><b style="font-size:14px">Inventory by status</b><div style="height:280px;margin-top:10px"><canvas id="chart"></canvas></div></div>`;
  document.querySelectorAll('.kpi[data-go]').forEach(el=>el.onclick=()=>goKpi(el.dataset.go));
  const bs=r.byStatus||{};const labels=Object.keys(bs);const data=labels.map(x=>bs[x]);
  if(window.Chart&&labels.length){new Chart(document.getElementById('chart'),{type:'bar',data:{labels,datasets:[{label:'Units',data,backgroundColor:'#1a56db'}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});}
  else document.getElementById('chart').outerHTML='<p class="muted">No inventory yet.</p>';
}

const ACCESS_GROUPS=['Fixed Assets','Project Management','Inventory & Procurement','Asset Management','HCM','Finance & Accounting','Plan & Optimize','Reports'];
function fieldInput(col,cur){
  const v=cur&&cur[col.name]!=null?cur[col.name]:'';
  if(col.type==='perms'){
    const sel=v?String(v).split(',').map(s=>s.trim()).filter(Boolean):[];
    return `<input type="hidden" id="f_${col.name}" value="${esc(sel.join(','))}">
      <div class="perms" id="perms_${col.name}">
        <span class="pbox pall" data-g="__ALL__">All access</span>`+
      ACCESS_GROUPS.map(g=>`<span class="pbox${sel.includes(g)?' on':''}" data-g="${esc(g)}">${esc(g)}</span>`).join('')+
      `</div>`;
  }
  if(col.type==='textarea')return `<textarea id="f_${col.name}" rows="2">${esc(v)}</textarea>`;
  if(col.type==='num')return `<input id="f_${col.name}" type="number" step="any" value="${esc(v)}">`;
  if(col.type==='date')return `<input id="f_${col.name}" type="date" value="${esc(v)}">`;
  if(col.type==='select'){
    if(col.opts)return `<select id="f_${col.name}"><option value=""></option>${col.opts.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    return `<select id="f_${col.name}" data-lk="${col.lookup}" data-lv="${col.lv}" data-ll="${col.ll}"><option value="">Loading…</option></select>`;
  }
  return `<input id="f_${col.name}" value="${esc(v)}">`;
}
async function fillLookups(scope,cur){
  const sels=(scope||document).querySelectorAll('select[data-lk]');
  for(const s of sels){const rows=await lookup(s.dataset.lk);const v=cur&&cur[s.id.slice(2)];
    s.innerHTML='<option value=""></option>'+rows.map(r=>`<option value="${esc(r[s.dataset.lv])}" ${String(v)===String(r[s.dataset.lv])?'selected':''}>${esc(r[s.dataset.ll])}</option>`).join('');}
}
async function openForm(key,cur){
  const mod=REG[key];const editable=mod.cols.filter(c=>c.type!=='ro'||!cur);
  const cols=mod.cols.filter(c=>!(c.type==='ro'&&(c.name===(mod.seq&&mod.seq.field)||['status'].includes(c.name))));
  modal(`<h2>${cur?'Edit':'New'} ${esc(mod.label.replace(/s$/,''))}</h2>
    <div class="grid2">${cols.map(c=>`<div class="field"><label>${esc(c.label)}</label>${fieldInput(c,cur)}</div>`).join('')}</div>
    <div class="right" style="text-align:right;margin-top:8px"><button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="primary" id="save">Save</button> <span id="ferr" class="err"></span></div>`);
  await fillLookups(document.getElementById('modal'),cur);
  document.querySelectorAll('.perms').forEach(wrap=>{
    const hid=document.getElementById(wrap.id.replace('perms_','f_'));
    const sync=()=>{const on=[...wrap.querySelectorAll('.pbox.on:not(.pall)')].map(x=>x.dataset.g);hid.value=on.join(',');};
    wrap.querySelectorAll('.pbox').forEach(b=>b.onclick=()=>{
      if(b.dataset.g==='__ALL__'){const all=wrap.querySelectorAll('.pbox:not(.pall)');const turnOn=[...all].some(x=>!x.classList.contains('on'));all.forEach(x=>x.classList.toggle('on',turnOn));}
      else b.classList.toggle('on');
      sync();
    });
  });
  document.getElementById('save').onclick=async()=>{
    const body={};cols.forEach(c=>{const el=document.getElementById('f_'+c.name);if(el&&el.value!=='')body[c.name]=el.value;});
    const r=cur?await PUT(`/m/${key}/${cur.id}`,body):await POST(`/m/${key}`,body);
    if(r.ok){closeModal();route();}else document.getElementById('ferr').textContent=r.error||'Error';
  };
}
async function viewModule(m,key){
  const mod=REG[key];
  m.innerHTML=`<h1>${esc(mod.label)}</h1><p class="sub">${esc(mod.group)}</p>
    <div class="toolbar">
      ${mod.search&&mod.search.length?`<input id="q" placeholder="Search…" style="min-width:220px">`:''}
      ${mod.cols.some(c=>c.name==='category')?`<select id="cat"><option value="">All classes</option></select>`:''}
      ${mod.date?`<span class="muted" style="font-size:13px">From</span><input id="from" type="date"><span class="muted" style="font-size:13px">To</span><input id="to" type="date"><button class="ghost sm" id="flt">Apply</button>`:''}
      <span class="right"></span>
      ${mod.readonly?'':`<button class="primary" id="new">+ New ${esc(mod.label.replace(/s$/,''))}</button>`}
    </div>
    <div id="tbl" class="muted">Loading…</div>`;
  const initStatus=(PENDING&&PENDING.status)||''; PENDING=null;
  async function load(){
    const q=val('q'),from=val('from'),to=val('to'),cat=val('cat');
    const r=await A(`/m/${key}?q=${encodeURIComponent(q)}&from=${from}&to=${to}&status=${encodeURIComponent(initStatus)}&category=${encodeURIComponent(cat)}&size=100`);
    const cols=mod.cols;const hasAct=(mod.actions&&mod.actions.length)||!mod.readonly;
    const lkmaps={};
    for(const c of cols){if(c.lookup&&c.lv!==c.ll){const lr=await lookup(c.lookup);const mp={};lr.forEach(rr=>mp[String(rr[c.lv])]=rr[c.ll]);lkmaps[c.name]=mp;}}
    document.getElementById('tbl').innerHTML=`<p class="muted" style="font-size:13px">${r.total} record(s)${initStatus?` · <b>${esc(initStatus)}</b> <a onclick="PENDING=null;go('${key}')" style="color:var(--acc);cursor:pointer">clear filter</a>`:''}</p>`+
      `<table><thead><tr>${cols.map(c=>`<th class="${c.type==='num'?'rt':''}">${esc(c.label)}</th>`).join('')}${hasAct?'<th></th>':''}</tr></thead><tbody>`+
      ((r.rows||[]).length?r.rows.map(row=>`<tr class="clk" data-row="${row.id}">${cols.map(c=>{let v=row[c.name];if(lkmaps[c.name]&&v!=null&&v!=='')v=lkmaps[c.name][String(v)]||v;if(c.type==='perms'){const ps=v?String(v).split(',').filter(Boolean):[];return `<td><div class="permchips">${ps.length?ps.map(p=>`<span class="pc">${esc(p)}</span>`).join(''):'<span class="muted" style="font-size:12px">No access set</span>'}</div></td>`;}if(c.name==='status'||c.name==='doc_type')return `<td><span class="chip ${chipCls(v)}">${esc(v)}</span></td>`;if(c.type==='num')return `<td class="rt">${money(v)}</td>`;if(c.type==='ro'&&c.name.endsWith('_no'))return `<td><b>${esc(v)}</b></td>`;return `<td>${esc(v)}</td>`;}).join('')}${hasAct?`<td class="rt">${rowActions(mod,key,row)}</td>`:''}</tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="muted">No records yet.</td></tr>`)+
      '</tbody></table>';
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(key,r.rows.find(x=>x.id==b.dataset.edit)));
    document.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{await POST(`/act/${b.dataset.act}/${b.dataset.id}`);route();});
    document.querySelectorAll('tr[data-row]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('button')||e.target.closest('a'))return;openDetail(key,r.rows.find(x=>x.id==tr.dataset.row));});
  }
  if(document.getElementById('new'))document.getElementById('new').onclick=()=>openForm(key,null);
  if(document.getElementById('q'))document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')load();});
  if(document.getElementById('flt'))document.getElementById('flt').onclick=load;
  const catSel=document.getElementById('cat');
  if(catSel){A('/distinct/'+key+'/category').then(d=>{catSel.innerHTML='<option value="">All classes</option>'+(d.vals||[]).map(v=>`<option>${esc(v)}</option>`).join('');});catSel.onchange=load;}
  load();
}
function rowActions(mod,key,row){
  let h='';
  (mod.actions||[]).forEach(a=>{if(!a.when||String(row.status)===a.when)h+=`<button class="ghost sm" data-act="${a.id}" data-id="${row.id}">${esc(a.label)}</button> `;});
  if(!mod.readonly)h+=`<button class="ghost sm" data-edit="${row.id}">Edit</button>`;
  return h;
}
function openDetail(key,row){
  const mod=REG[key];
  const fields=mod.cols.map(c=>{let v=row[c.name];const disp=(c.name==='status'||c.name==='doc_type')?`<span class="chip ${chipCls(v)}">${esc(v)}</span>`:(c.type==='num'?money(v):esc(v==null?'':v));return `<div class="field"><label>${esc(c.label)}</label><div style="font-size:15px">${disp||'<span class=muted>—</span>'}</div></div>`;}).join('');
  let acts='';(mod.actions||[]).forEach(a=>{if(!a.when||String(row.status)===a.when)acts+=`<button class="ghost" data-da="${a.id}">${esc(a.label)}</button> `;});
  const title=row[(mod.seq&&mod.seq.field)]||row.serial_no||row.name||('#'+row.id);
  modal(`<h2>${esc(mod.label.replace(/s$/,''))} · ${esc(title)}</h2><div class="grid2">${fields}</div><div class="right" style="text-align:right;margin-top:12px">${acts}${mod.readonly?'':`<button class="ghost" id="dedit">Edit</button> `}<button class="primary" onclick="closeModal()">Close</button></div>`);
  if(document.getElementById('dedit'))document.getElementById('dedit').onclick=()=>{closeModal();openForm(key,row);};
  document.querySelectorAll('[data-da]').forEach(b=>b.onclick=async()=>{await POST(`/act/${b.dataset.da}/${row.id}`);closeModal();route();});
}

async function viewReceiving(m){
  const pos=(await A('/m/pos?size=200')).rows.filter(p=>['APPROVED','PARTIAL'].includes(p.status));
  m.innerHTML=`<h1>Receiving</h1><p class="sub">Receive units into inventory · duplicates auto-detected</p>
    <div class="panel" style="max-width:640px">
      <div class="field"><label>Against PO (optional)</label><select id="po"><option value="">— none —</option>${pos.map(p=>`<option value="${p.id}">${esc(p.po_no)} — ${esc(p.vendor||'')}</option>`).join('')}</select></div>
      <div class="grid2"><div class="field"><label>Item description</label><input id="idesc"></div><div class="field"><label>Location</label><input id="loc" value="Main"></div></div>
      <div class="field"><label>Serial numbers (one per line)</label><textarea id="serials" rows="8"></textarea></div>
      <button class="primary" id="recv">Receive into inventory</button><div id="res" style="margin-top:12px"></div>
    </div>`;
  document.getElementById('recv').onclick=async()=>{
    const serials=val('serials').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const r=await POST('/receive',{po_id:val('po')||null,item_desc:val('idesc'),location:val('loc'),serials});
    document.getElementById('res').innerHTML=r.ok?`<p class="ok">Received ${r.received} serial(s).${r.dupeCount?` <span class="err">${r.dupeCount} duplicate(s) skipped: ${esc(r.duplicatesSkipped.join(', '))}</span>`:''}</p>`:`<p class="err">${esc(r.error)}</p>`;
  };
}

async function viewJournal(m){
  const r=await A('/m/journal?size=100');
  m.innerHTML=`<h1>Journal Entries</h1><p class="sub">Finance · double-entry</p>
    <div class="toolbar"><span class="right"></span><button class="primary" id="new">+ New Journal Entry</button></div>
    <table><thead><tr><th>JE No</th><th>Date</th><th>Source</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody>
    ${(r.rows||[]).length?r.rows.map(x=>`<tr><td><b>${esc(x.je_no)}</b></td><td>${esc(x.je_date||'')}</td><td>${esc(x.source||'')}</td><td>${esc(x.description||'')}</td><td><span class="chip ${chipCls(x.status)}">${esc(x.status)}</span></td><td class="rt">${x.status==='DRAFT'?`<button class="ghost sm" data-post="${x.id}">Post</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">No entries yet.</td></tr>'}
    </tbody></table>`;
  document.querySelectorAll('[data-post]').forEach(b=>b.onclick=async()=>{await POST('/act/je-post/'+b.dataset.post);route();});
  document.getElementById('new').onclick=openJournal;
}
async function openJournal(){
  const accts=await lookup('accounts');
  const opt=accts.map(a=>`<option value="${esc(a.code)}" data-n="${esc(a.name)}">${esc(a.code)} — ${esc(a.name)}</option>`).join('');
  const lineRow=()=>`<div class="jl-row"><select class="jl-acct"><option value=""></option>${opt}</select><input class="jl-dr" type="number" step="any" placeholder="Debit"><input class="jl-cr" type="number" step="any" placeholder="Credit"><input class="jl-memo" placeholder="Memo"><button class="ghost sm jl-x">×</button></div>`;
  modal(`<h2>New Journal Entry</h2>
    <div class="grid2"><div class="field"><label>Date</label><input id="je_date" type="date"></div><div class="field"><label>Source</label><input id="je_src" value="Manual"></div></div>
    <div class="field"><label>Description</label><input id="je_desc"></div>
    <label style="font-size:12px;color:var(--mut);font-weight:600">Lines</label><div id="lines">${lineRow()}${lineRow()}</div>
    <button class="ghost sm" id="addln">+ Add line</button>
    <div style="margin-top:12px;text-align:right"><span id="bal" class="muted" style="font-size:13px"></span><br><button class="ghost" onclick="closeModal()">Cancel</button> <button class="primary" id="saveJE">Create</button> <span id="jerr" class="err"></span></div>`);
  const recalc=()=>{let d=0,cr=0;document.querySelectorAll('.jl-dr').forEach(x=>d+=Number(x.value)||0);document.querySelectorAll('.jl-cr').forEach(x=>cr+=Number(x.value)||0);document.getElementById('bal').textContent=`Debit ${money(d)} · Credit ${money(cr)} · ${Math.abs(d-cr)<0.005?'balanced':'OUT OF BALANCE'}`;};
  document.getElementById('lines').addEventListener('input',recalc);
  document.getElementById('lines').addEventListener('click',e=>{if(e.target.classList.contains('jl-x')){e.target.closest('.jl-row').remove();recalc();}});
  document.getElementById('addln').onclick=()=>{document.getElementById('lines').insertAdjacentHTML('beforeend',lineRow());};
  recalc();
  document.getElementById('saveJE').onclick=async()=>{
    const lines=[...document.querySelectorAll('#lines .jl-row')].map(r=>{const a=r.querySelector('.jl-acct');return{account_code:a.value,account_name:a.selectedOptions[0]?a.selectedOptions[0].dataset.n:'',debit:r.querySelector('.jl-dr').value,credit:r.querySelector('.jl-cr').value,memo:r.querySelector('.jl-memo').value};}).filter(l=>l.account_code&&(Number(l.debit)||Number(l.credit)));
    const res=await POST('/journal',{je_date:val('je_date'),source:val('je_src'),description:val('je_desc'),lines});
    if(res.ok){closeModal();route();}else document.getElementById('jerr').textContent=res.error||'Error';
  };
}

async function viewReport(m,name){
  const title={gl:'General Ledger','trial-balance':'Trial Balance','ap-aging':'Payables Aging','location-balances':'Location Balances','fin-model':'Financial Model (Budget vs Forecast)'}[name];
  const dated=['gl','trial-balance','ap-aging'].includes(name);
  m.innerHTML=`<h1>${esc(title)}</h1><p class="sub">Reports</p>
    <div class="toolbar">${dated?`<span class="muted" style="font-size:13px">From</span><input id="rfrom" type="date"><span class="muted" style="font-size:13px">To</span><input id="rto" type="date"><button class="ghost sm" id="rgo">Apply</button>`:''}</div>
    <div id="rbody" class="muted">Loading…</div>`;
  async function load(){
    const from=val('rfrom'),to=val('rto');
    const r=await A(`/report/${name}?from=${from}&to=${to}`);const rows=r.rows||[];
    const T=(cols)=>`<table><thead><tr>${cols.map(c=>`<th class="${c[2]?'rt':''}">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(x=>`<tr>${cols.map(c=>`<td class="${c[2]?'rt':''}">${c[2]?money(x[c[0]]):esc(x[c[0]])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="muted">No data.</td></tr>`}</tbody></table>`;
    let body='';
    if(name==='gl')body=T([['je_no','JE No'],['je_date','Date'],['account_code','Account'],['account_name','Name'],['debit','Debit',1],['credit','Credit',1],['memo','Memo']]);
    else if(name==='trial-balance')body=T([['account_code','Account'],['account_name','Name'],['debit','Debit',1],['credit','Credit',1],['balance','Balance',1]])+`<p class="sub" style="margin-top:10px">Total Debit ${money(r.totalDebit)} · Total Credit ${money(r.totalCredit)}</p>`;
    else if(name==='ap-aging')body=T([['bill_no','Bill'],['vendor','Vendor'],['due_date','Due'],['amount','Amount',1],['balance','Balance',1],['days','Days']]);
    else if(name==='location-balances')body=T([['location','Location'],['status','Status'],['qty','Qty']]);
    else if(name==='fin-model')body=T([['account','Account'],['budget','Budget',1],['forecast','Forecast',1],['variance','Variance',1]]);
    document.getElementById('rbody').innerHTML=body;
  }
  if(document.getElementById('rgo'))document.getElementById('rgo').onclick=load;
  load();
}

async function showLogin(){document.getElementById('nav').innerHTML='';document.getElementById('main').innerHTML=`<div class="login"><h1>Sign in</h1><p class="sub">Enter your team passcode.</p><div class="field"><input id="pc" type="password" placeholder="Passcode"></div><button class="primary" id="lg" style="width:100%">Sign in</button><p id="le" class="err"></p></div>`;}

(async function init(){
  let me=null;try{me=await A('/me');}catch(e){}
  if(!me||me.ok!==true){showLogin();return;}
  document.getElementById('who').textContent=me.email||'';
  const reg=await A('/registry');REG=reg.modules||{};GROUPS={};
  for(const k in REG){const g=REG[k].group;(GROUPS[g]=GROUPS[g]||[]).push(k);}
  renderNav();route();
})();
</script>
